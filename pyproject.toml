[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgmrec-opt"
version = "12.0.0"
description = "LGMRec reference and transparent train-only extensions"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
lgmrec-train = "lgmrec.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lgmrec = ["configs/*.yaml", "configs/dataset/*.yaml", "configs/model/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
norecursedirs = ["references", "data", ".git"]
